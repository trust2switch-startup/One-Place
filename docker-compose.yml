services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneplace
      POSTGRES_USER: oneplace
      POSTGRES_PASSWORD: local_oneplace_password
    ports:
      - "5432:5432"
    volumes:
      - oneplace_db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  oneplace_db:
